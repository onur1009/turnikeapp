// Gradle derleme çıktılarını proje klasörünün dışına (sistem geçici klasörüne) yönlendirir.
// Proje Masaüstü'nde (OneDrive / Windows Defender) olduğunda Gradle, node_modules altındaki
// Capacitor eklentilerinin build klasörlerini silemeyip "Unable to delete directory" ile duruyordu.
// Kullanım: npm run android:apk  (APK: <tmp>/turnike-gradle-build/app/outputs/apk/debug/app-debug.apk)
allprojects {
    layout.buildDirectory = new File(new File(System.getProperty("java.io.tmpdir"), "turnike-gradle-build"), project.name)
}
