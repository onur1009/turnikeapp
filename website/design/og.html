<!doctype html>
<!-- Paylaşım görseli şablonu (1200×630). og.png buradan ekran görüntüsüyle üretilir; siteye girmez. -->
<html lang="tr"><head><meta charset="utf-8">
<style>
  @font-face { font-family: J; font-weight: 400 800; src: url(../src/fonts/jakarta-1.woff2) format('woff2'); }
  @font-face { font-family: J; font-weight: 400 800; src: url(../src/fonts/jakarta-0.woff2) format('woff2'); unicode-range: U+0100-02BA; }
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; background: #051424; color: #f4f1ea; font-family: J, sans-serif; display: grid; grid-template-columns: 1fr 340px; gap: 40px; padding: 64px 72px; box-sizing: border-box; overflow: hidden; position: relative; }
  .board { background: #0a1a2e; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; width: 520px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.14); font-weight: 800; letter-spacing: 1.5px; font-size: 18px; }
  .badge { background: #15803d; color: #fff; border-radius: 999px; padding: 2px 12px; }
  .next { padding: 14px 18px 18px; } .next small { display: block; color: #a9b6c6; letter-spacing: 4px; font-size: 14px; }
  .led { color: #f5b041; font-weight: 800; font-size: 34px; letter-spacing: 3px; }
  h1 { font-size: 72px; line-height: 1.02; margin: 40px 0 18px; letter-spacing: -1.5px; font-weight: 800; }
  h1 span { color: #f5b041; }
  p { font-size: 26px; color: #a9b6c6; margin: 0; }
  .phone { margin-top: -10px; border-radius: 34px; padding: 10px; background: #0e1c2e; border: 1px solid rgba(255,255,255,.14); transform: rotate(4deg); height: 720px; }
  .phone img { width: 100%; border-radius: 26px; display: block; }
</style></head>
<body><div class="og" id="og">
  <div>
    <div class="board"><div class="row"><span class="badge">M2</span>YENİKAPI – HACIOSMAN</div><div class="next"><small>SIRADAKİ DURAK</small><span class="led">► TAKSİM</span></div></div>
    <h1>Turnike:<br><span>Sözcük Seferi</span></h1>
    <p>İstanbul'u durak durak gez, kelimeleri bul.</p>
  </div>
  <div class="phone"><img src="../src/img/ekran-ana.webp" alt=""></div>
</div></body></html>
